name: CI

# Replaces the workflow inherited from upstream RightNow-AI/openfang.
#
# The inherited one ran twelve jobs and eleven of them passed — including the
# {ubuntu, macos, windows} build matrix, which this fork does clear. The twelfth,
# `cargo audit`, failed and would have kept failing on its own: this fork's
# Cargo.lock is pinned to v0.6.9 (openssl vendored, wasmtime 43, rusqlite bundled),
# while the advisory database it is checked against updates daily. That is a red
# badge nobody can turn green with a code change, on a repository people are meant
# to install from.
#
# What the audit actually reported, checked by hand rather than dismissed:
#
#   lettre        TLS hostname verification disabled on the Boring backend.
#                 DOES NOT APPLY: `boring` appears 0 times in Cargo.lock — this
#                 build uses native-tls.
#   rmcp          DNS rebinding in the Streamable HTTP server transport.
#                 A direct dependency. Tracked as real (FANG).
#   wasmtime      Stores can mix up type indices between engines.
#                 A direct dependency. Tracked as real (FANG).
#   quick-xml     Quadratic parse time, unbounded namespace allocation.
#   quinn-proto   Remote memory exhaustion on out-of-order stream reassembly.
#   crossbeam-epoch  Invalid pointer dereference in a `fmt::Pointer` impl.
#                 All transitive, through crates this fork does not call directly.
#
# Dropping the job is not the same as dropping the finding: the two that apply are
# in the tracker. What is dropped is a gate that reports "this fork is broken" when
# the fork has not changed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # The Tauri desktop crate is a workspace member, so `--workspace` pulls it in
      # even when the work is in non-GUI crates. Without these it fails to link.
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

# ─────────────────────────────────────────────────────────────────────────────
# Two things this workflow does not do, stated so nobody assumes otherwise.
#
# It does not build for macOS or Windows. The inherited matrix did, and passed.
# It was dropped for run time, not because the fork fails there — if you need those
# targets, put the matrix back; there is no known reason it would go red.
#
# It does not run the repro scripts (`tests/fang/run.sh` and friends). They need a
# docker daemon, a named long-lived container, a host bind-mounted volume and
# `nsenter` into another container's namespace. A GitHub-hosted runner has none of
# that. Running them in CI needs a self-hosted runner wired to this project's docker
# setup — separate work, not provided here.
# ─────────────────────────────────────────────────────────────────────────────
