name: Fork CI

# This is a SEPARATE workflow from the upstream `ci.yml`. It intentionally does not
# touch `ci.yml`, whose push/PR triggers were narrowed to a branch nothing pushes to
# (see its header) once `ours` was renamed to `main`. `ours` was deleted on
# 2026-08-23 as a duplicate of `main`, so it is gone from the triggers below too: a
# branch filter naming a branch that does not exist reads as coverage and is none.
# `ours` had no CI at all before this file existed — 4,116 lines across 35 .rs files
# and 53 new tests were unguarded for three sprints.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── fmt / clippy / test, ubuntu-only ───────────────────────────────────────
  #
  # Deliberately NOT included, and why:
  #
  # - {ubuntu, macos, windows} matrix with `-D warnings`: this fork has never once
  #   built on macOS or Windows. Any cfg-gated import that's unused off-Linux would
  #   turn the whole run red on day one, with no ceiling on how much platform-specific
  #   cleanup that drags in before the gate is ever green. Ubuntu-only until someone
  #   actually needs the other targets.
  #
  # - `cargo audit`: our Cargo.lock (227KB) is pinned to v0.6.9 — openssl vendored,
  #   wasmtime 43, rusqlite bundled. `cargo audit` is a moving target checked against
  #   whatever advisories exist on the day CI happens to run; it would fail PRs for
  #   advisories in pinned deps nobody touched, with no code change to make green.
  #
  # - `install-smoke`: upstream's job curls https://openfang.sh/install, which is
  #   upstream's own deploy endpoint, not ours. A break there is upstream's CI to run
  #   red, not ours.
  #
  # - a `secrets` job: upstream's version passes `--exclude-paths` including `.git/`,
  #   which would NOT have caught the real key leak this fork already had (the leak
  #   was in tracked file contents, not git internals — excluding `.git/` does nothing
  #   for that class of leak). Rather than ship a scanner with known-blind config, this
  #   is left out. Add one later, but only after it's been proven against a canary
  #   (a fake key committed to a scratch branch) BEFORE relying on its "clean" result —
  #   see the ERE/BRE quantifier trap that made a real key read as clean here before.
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Версия берётся из rust-toolchain.toml, а не из @stable: плавающий канал
      # красит гейт новым lint без единой правки кода — так CI и покраснел
      # 20 августа. Шаг «версии сходятся» ниже не даёт этим двум разъехаться.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91"
          components: clippy, rustfmt

      - name: версии тулчейна сходятся во всех четырёх местах
        # FANG-92: rust-toolchain.toml просил 1.91, Dockerfile был прибит к 1.88,
        # CI ставил @stable. Собиралось три разными версиями, и сборка образа
        # упала на MSRV зависимостей ровно тогда, когда это было некстати.
        # Расхождение теперь не сливается: шаг падает раньше.
        run: |
          set -euo pipefail
          toolchain=$(grep -oP 'channel\s*=\s*"\K[^"]+' rust-toolchain.toml)
          msrv=$(grep -oP '^rust-version\s*=\s*"\K[^"]+' Cargo.toml)
          docker_versions=$(grep -oP '^FROM rust:\K[0-9.]+' Dockerfile | sort -u)
          workflow=$(grep -oP 'toolchain:\s*"\K[^"]+' .github/workflows/fork-ci.yml)
          echo "rust-toolchain.toml=$toolchain  Cargo.toml=$msrv  workflow=$workflow"
          echo "Dockerfile=$(echo "$docker_versions" | tr '\n' ' ')"
          for v in $msrv $workflow $docker_versions; do
            if [ "$v" != "$toolchain" ]; then
              echo "::error::версии тулчейна разошлись: ожидалось $toolchain, встретилось $v"
              exit 1
            fi
          done
          echo "сходятся: $toolchain"

      - uses: Swatinem/rust-cache@v2

      # Tauri desktop crate is a workspace member; --workspace pulls it in even for
      # fmt/clippy/test on non-GUI crates, so these system libs are needed to link.
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        # The openfang-runtime binary contains hundreds of Wasmtime-heavy tests.
        # Keep the complete workspace suite while bounding peak memory use on
        # GitHub-hosted runners.
        run: cargo test --workspace -- --test-threads=2


  # ── Образ в GHCR: то, что тянут серверы ────────────────────────────────────
  #
  # Зависит от `check`, и это главное в этой джобе: образ существует только
  # тогда, когда fmt, clippy и весь набор тестов прошли. Гейт не правило,
  # которое можно забыть, а условие, без которого артефакта не будет.
  #
  # Только linux/amd64. Прод отвечает `"arch": "x86_64"`; сборка под arm64 идёт
  # через эмуляцию QEMU и удваивает время ради платформы, которой у нас нет.
  # Появится arm-сервер — добавится строка, не раньше.
  #
  # Тега `latest` здесь НЕТ намеренно. Подвижный `latest` — это способ выкатить
  # не то, что собирался. `:main` движется и годится посмотреть, `:<sha>`
  # неизменен и годится деплоить. Сервер пинит sha.
  image:
    # Собирается ВСЕГДА, публикуется только с main.
    #
    # Раньше джоба запускалась только на пуш в main, и поломка сборки образа
    # становилась видна уже ПОСЛЕ слияния. Ровно так и вышло: ветка пасскея
    # прибила Dockerfile к rust 1.88 — ниже MSRV, объявленного в Cargo.toml, —
    # PR прошёл зелёным (там `cargo test` ставил тулчейн отдельным шагом), а
    # упало при первой же сборке образа с main. Проверять после слияния то,
    # что можно проверить до, — это гейт, который приходит с опозданием.
    name: Образ → ghcr.io/kyzdes/fang-upgrade
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          # `git describe` без тегов вернёт голый sha, и /api/version солжёт
          # о том, какая это версия. Полная история стоит секунд.
          fetch-depth: 0

      - name: Отметки сборки
        id: stamp
        run: |
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "describe=$(git describe --tags --always)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Вход в GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Сборка и публикация
        uses: docker/build-push-action@v7
        with:
          context: .
          # На PR образ собирается и выбрасывается: доказательство, что Dockerfile
          # цел, нужно до слияния, а тег в реестре — нет.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          platforms: linux/amd64
          # Эти три доезжают до /api/version. Без них сборка не может сказать,
          # какая она — ровно то, что чинили в FANG-6.
          build-args: |
            GIT_SHA=${{ steps.stamp.outputs.sha }}
            GIT_DESCRIBE=${{ steps.stamp.outputs.describe }}
            BUILD_DATE=${{ steps.stamp.outputs.date }}
          tags: |
            ghcr.io/kyzdes/fang-upgrade:main
            ghcr.io/kyzdes/fang-upgrade:${{ steps.stamp.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/kyzdes/fang-upgrade
            org.opencontainers.image.revision=${{ steps.stamp.outputs.sha }}
            org.opencontainers.image.version=${{ steps.stamp.outputs.describe }}
            org.opencontainers.image.description=fang-upgrade — OpenFang v0.6.9 с починенными дефектами
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ─────────────────────────────────────────────────────────────────────────────
# NOTE on shell-repro scripts (run.sh and friends):
#
# This workflow does NOT make run.sh, or any other shell-based repro script that
# depends on a running docker daemon, a named container, a host bind-mounted volume,
# or `nsenter`, usable in CI. GitHub-hosted ubuntu-latest runners have none of that
# available in the way this repo's repro scripts assume (no long-lived named
# container to exec into, no host path identical to the one the repro script
# expects, no nsenter into another container's namespace). If a repro script needs
# to actually run in CI rather than just exist in the repo, that requires a
# self-hosted runner wired to this project's docker/volume setup — that is separate
# work, not something this workflow provides. See CONTRIBUTING.md.
# ─────────────────────────────────────────────────────────────────────────────
