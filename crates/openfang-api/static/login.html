<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Вход — OpenFang</title>
  <style nonce="__NONCE__">
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #070709;
      color: #f4f4f5;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 15%, rgba(249, 115, 22, .16), transparent 34rem),
        radial-gradient(circle at 85% 85%, rgba(234, 88, 12, .1), transparent 30rem),
        #070709;
    }
    main { width: min(100%, 420px); }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 20px;
    }
    .brand img { width: 42px; height: 42px; border-radius: 10px; }
    .brand strong { display: block; letter-spacing: .18em; font-size: 16px; }
    .brand span { display: block; margin-top: 3px; color: #a1a1aa; font-size: 13px; }
    .card {
      padding: 30px;
      border: 1px solid #27272a;
      border-radius: 18px;
      background: rgba(18, 18, 21, .94);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .48);
    }
    h1 { margin: 0 0 8px; font-size: 25px; line-height: 1.2; }
    .intro { margin: 0 0 26px; color: #a1a1aa; font-size: 14px; line-height: 1.55; }
    label { display: block; margin: 0 0 8px; color: #d4d4d8; font-size: 13px; font-weight: 600; }
    input {
      width: 100%;
      min-height: 46px;
      margin: 0 0 18px;
      padding: 11px 13px;
      border: 1px solid #3f3f46;
      border-radius: 10px;
      outline: none;
      background: #0c0c0f;
      color: #fafafa;
      font: inherit;
    }
    input:focus { border-color: #f97316; box-shadow: 0 0 0 3px rgba(249, 115, 22, .16); }
    button {
      width: 100%;
      min-height: 46px;
      border: 0;
      border-radius: 10px;
      background: #f97316;
      color: #140b05;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }
    button:hover { background: #fb923c; }
    button:focus-visible { outline: 3px solid rgba(251, 146, 60, .45); outline-offset: 2px; }
    button:disabled { cursor: wait; opacity: .65; }
    .error {
      min-height: 20px;
      margin: -4px 0 14px;
      color: #fca5a5;
      font-size: 13px;
      line-height: 1.4;
    }
    .security { margin: 18px 2px 0; color: #71717a; font-size: 12px; line-height: 1.5; text-align: center; }
    noscript { display: block; margin-top: 16px; color: #fca5a5; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <img src="/logo.png" alt="" width="42" height="42">
      <div><strong>OPENFANG</strong><span>Denis Agency</span></div>
    </div>
    <section class="card" aria-labelledby="login-title">
      <h1 id="login-title">Вход в админку</h1>
      <p class="intro">Введите имя пользователя и пароль. После входа защищённая сессия сохранится в браузере.</p>
      <form id="login-form" novalidate>
        <label for="username">Имя пользователя</label>
        <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>

        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <div id="error" class="error" role="alert" aria-live="polite"></div>
        <button id="submit" type="submit">Войти</button>
      </form>
      <p class="security">Данные входа не записываются в localStorage. Браузер получает только защищённую HttpOnly cookie.</p>
      <noscript>Для входа необходимо включить JavaScript.</noscript>
    </section>
  </main>
  <script nonce="__NONCE__">
    'use strict';
    (function () {
      var form = document.getElementById('login-form');
      var username = document.getElementById('username');
      var password = document.getElementById('password');
      var submit = document.getElementById('submit');
      var error = document.getElementById('error');

      fetch('/api/auth/check', { credentials: 'same-origin', cache: 'no-store' })
        .then(function (response) { return response.ok ? response.json() : null; })
        .then(function (state) {
          if (state && state.authenticated) window.location.replace('/');
        })
        .catch(function () {});

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        error.textContent = '';
        if (!form.reportValidity()) return;

        submit.disabled = true;
        submit.textContent = 'Входим…';
        try {
          var response = await fetch('/api/auth/login', {
            method: 'POST',
            credentials: 'same-origin',
            cache: 'no-store',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username.value, password: password.value })
          });
          var result = await response.json().catch(function () { return {}; });
          password.value = '';
          if (!response.ok) {
            error.textContent = response.status === 429
              ? 'Слишком много попыток. Подождите минуту и попробуйте снова.'
              : 'Неверное имя пользователя или пароль.';
            password.focus();
            return;
          }
          if (result.status !== 'ok') throw new Error('Unexpected response');
          window.location.replace('/');
        } catch (requestError) {
          password.value = '';
          error.textContent = 'Не удалось связаться с сервером. Попробуйте ещё раз.';
        } finally {
          submit.disabled = false;
          submit.textContent = 'Войти';
        }
      });
    })();
  </script>
</body>
</html>
